name: Deploy to EC2 with Docker Hub

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ⭐️ 해결책: 중복 경로 버그를 피하기 위해 defaults를 빼고 폴더명만 직접 찌릅니다.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: boogle-backend

      # 1. 가상 환경 내부에서 JAR 빌드
      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test
        working-directory: boogle-backend

      # 2. 내 기존 Secrets 토큰으로 도커허브 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 이미지 빌드 후 도커허브 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # 도커 빌드 컨텍스트 역시 상대 표기법 없이 명확히 폴더를 지정합니다.
          context: boogle-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/boogle-backend:latest

      # 4. EC2 원격 접속 후 배포 명령어 수행
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            # 깃허브 저장소 dev 브랜치의 하위 폴더에서 docker-compose.yml 다운로드
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/dev/boogle-backend/docker-compose.yml
            
            # 도커허브에서 새 이미지 땡겨오고 실행
            docker-compose pull
            docker-compose up -d
            
            # 안 쓰는 옛날 이미지 찌꺼기 삭제해서 디스크 용량 지키기
            docker image prune -f