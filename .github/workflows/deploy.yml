name: Deploy to Kubernetes

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: demo # 내 프로젝트 폴더 이름

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create secret-prod.properties
        run: |
          echo "${{ secrets.SECRET_PROD_PROPERTIES }}" \
            > src/main/resources/secret-prod.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 1. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./demo
          file: ./demo/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/boogle:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/boogle:${{ github.sha }}

      # 3. 쿠버네티스 클러스터 연결 설정
      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # 4. deployment.yml 내의 이미지 태그를 현재 빌드된 태그로 치환 후 배포
      - name: Deploy to Kubernetes cluster
        run: |
          sed -i "s|your-docker-registry/boogle:latest|${{ secrets.DOCKERHUB_USERNAME }}/boogle:${{ github.sha }}|g" k8s/deployment.yml
          kubectl apply -f k8s/deployment.yml