name: Deploy to EC2 with Docker Hub

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ⭐️ [강제 주입] 빌드 러너의 절대 경로를 기준 삼아 resources 폴더에 확실하게 꽂아 넣습니다.
      - name: Create secret-prod.properties
        run: |
          mkdir -p demo/src/main/resources
          echo "${{ secrets.SECRET_PROD_PROPERTIES }}" > demo/src/main/resources/secret-prod.properties

      # 1. 이제 secret 파일이 100% 포함된 상태로 빌드를 진행합니다.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: demo

      # --no-daemon을 추가하여 이전 캐시를 무시하고 무조건 새로 패키징하게 만듭니다.
      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test --no-daemon
        working-directory: demo

      # 2. 내 기존 Secrets 토큰으로 도커허브 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 이미지 빌드 후 도커허브 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/boogle-backend:latest
            
            # deploy.yml 맨 밑 부분 수정
            # 4. EC2 원격 접속 후 배포 명령어 수행
                  - name: Deploy to EC2 via SSH
                  uses: appleboy/ssh-action@master
                  with:
                    host: ${{ secrets.EC2_HOST }}
                    username: ubuntu
                    key: ${{ secrets.EC2_SSH_KEY }}
                    script: |
                      cd ~
                      curl -O https://raw.githubusercontent.com/${{ github.repository }}/dev/docker-compose.yml
                      
                      # ❌ 기존: docker-compose -> ⭕ 변경: 하이픈(-)을 빼고 한 칸 띄워줍니다!
                      docker compose pull
                      docker compose up -d
                      
                      docker image prune -f