name: Deploy to EC2 with Docker Hub

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ⭕ [경로 교정] working-directory가 demo이므로 src/main/resources 주소만 써야 정확히 찾아갑니다.
      - name: Create secret-prod.properties
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.SECRET_PROD_PROPERTIES }}" > src/main/resources/secret-prod.properties
        working-directory: demo

      # 1. 이제 secret 파일이 포함된 상태로 안전하게 빌드합니다.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: demo

      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test
        working-directory: demo

      # 2. 내 기존 Secrets 토큰으로 도커허브 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 이미지 빌드 후 도커허브 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/boogle-backend:latest

      # 4. EC2 원격 접속 후 배포 명령어 수행
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            # dev 브랜치 최상위에 있는 docker-compose.yml 다운로드
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/dev/docker-compose.yml
            
            # 도커허브에서 새 이미지 땡겨오고 실행
            docker-compose pull
            docker-compose up -d
            
            # 안 쓰는 옛날 이미지 찌꺼기 즉시 제거
            docker image prune -f