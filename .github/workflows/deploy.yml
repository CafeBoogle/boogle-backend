name: Deploy to Kubernetes

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: demo

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create secret-prod.properties
        run: |
          echo "${{ secrets.SECRET_PROD_PROPERTIES }}" \
            > src/main/resources/secret-prod.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 1. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./demo
          file: ./demo/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/boogle:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/boogle:${{ github.sha }}

      # 3. ⭐️ SSH로 EC2에 접속하여 내부에서 쿠버네티스 배포 실행 (방화벽 우회)
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            export KUBECONFIG=$HOME/.kube/config
            cd ~/app/boogle/k8s
            
            # 서버 내부에 deployment.yml 파일 내용을 직접 덮어씁니다.
            cat << 'EOF' > deployment.yml
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: boogle-deployment
              labels:
                app: boogle
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: boogle
              template:
                metadata:
                  labels:
                    app: boogle
                spec:
                  containers:
                  - name: boogle
                    image: ${{ secrets.DOCKERHUB_USERNAME }}/boogle:${{ github.sha }}
                    ports:
                    - containerPort: 8080
                    env:
                    - name: SPRING_PROFILES_ACTIVE
                      value: "prod"
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: boogle-service
            spec:
              type: LoadBalancer
              selector:
                app: boogle
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 8080
            EOF
            
            # 서버 로컬 환경에서 직접 쿠버네티스 배포 명령 실행
            kubectl apply -f deployment.yml --validate=false