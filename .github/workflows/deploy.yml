name: Deploy to EC2 with Docker Hub

on:
  push:
    branches: [ "dev" ]

# ⭐️ 핵심: 모든 파일이 boogle-backend 폴더 안에 있으므로 기본 실행 경로를 지정합니다.
defaults:
  run:
    working-directory: ./boogle-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 이제 boogle-backend/gradlew 를 정확하게 찾아 들어갑니다.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. 가상 환경 내부에서 JAR 빌드
      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test

      # 2. 내 기존 Secrets 토큰으로 도커허브 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 이미지 빌드 후 도커허브 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # working-directory와 별개로, 빌드 컨텍스트 자체를 하위 폴더로 명시해야 Dockerfile을 찾습니다.
          context: ./boogle-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/boogle-backend:latest

      # 4. EC2 원격 접속 후 배포 명령어 수행
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            # ⭐️ 깃허브 다운로드 주소에도 하위 폴더 경로(boogle-backend)를 정확히 추가했습니다.
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/dev/boogle-backend/docker-compose.yml
            
            # 도커허브에서 새 이미지 땡겨오고 실행
            docker-compose pull
            docker-compose up -d
            
            # 안 쓰는 옛날 이미지 찌꺼기 삭제해서 디스크 용량 지키기
            docker image prune -f