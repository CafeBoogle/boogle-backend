spring:
  config:
    import: optional:classpath:secret.properties

  profiles:
    active: dev   # 기본 실행 프로파일

  application:
    name: demo

  datasource:
    url: jdbc:h2:file:./data/testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 10MB       # 파일 하나당 최대 용량
      max-request-size: 10MB    # 전체 요청당 최대 용량

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 1209600000

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  client-secret: ${KAKAO_CLIENT_SECRET}
  logout-redirect-uri: ${KAKAO_LOGOUT_REDIRECT_URI}

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  redirect-uri: ${NAVER_REDIRECT_URI}

file:
  upload-dir: ./uploads/profiles/

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    # 리소스 매핑 에러 방지용
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs