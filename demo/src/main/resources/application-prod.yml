server:
  port: 8080
  servlet:
    context-path: /boogle/api

spring:
  datasource:
    url: jdbc:h2:file:/home/ubuntu/app/data/testdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

file:
  upload-dir: /home/ubuntu/app/uploads/profiles/

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

app:
  frontend-url: https://moonsunpower.com/boogle