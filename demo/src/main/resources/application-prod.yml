server:
  port: 8080
  servlet:
    context-path: /boogle
  forward-headers-strategy: framework

app:
  frontend-url: https://localhost:5173

spring:
  datasource:
    url: jdbc:h2:file:/home/app/data/testdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa

  config:
    import: classpath:secret-prod.properties

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    auth-required: false

file:
  upload-dir:
    profile: /home/ubuntu/app/uploads/profiles/
    review: /home/ubuntu/app/uploads/reviews/