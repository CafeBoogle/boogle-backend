server:
  port: 8080

app:
  frontend-url: http://localhost:5173

spring:
  datasource:
    url: jdbc:h2:file:./data/testdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

file:
  upload-dir: ./uploads/profiles/